name: doclens-dev

services:
  backend:
    build:
      context: ./backend
      target: development
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/src:/workspace/src:ro
      - ./backend/pom.xml:/workspace/pom.xml:ro
      - maven-cache:/root/.m2
      - backend-target:/workspace/target
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 60

  frontend:
    build:
      context: ./frontend
      target: development
    init: true
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12

volumes:
  maven-cache:
  backend-target:
  frontend-node-modules:
